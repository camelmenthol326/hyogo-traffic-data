name: Update traffic data

on:
  schedule:
    # GitHub Actions uses UTC. These are 08:00, 12:00, and 17:00 in Japan.
    - cron: '0 23 * * *'
    - cron: '0 3 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-traffic-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PDF text tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Run parser tests
        run: python -m unittest discover -s cloud/tests -v

      - name: Download and parse official PDFs
        run: python -m cloud.update_data

      - name: Save updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/traffic-data.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Update traffic data"
          git push
